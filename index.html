<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wissensspeicher</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wissensspeicher">
<meta name="theme-color" content="#24392B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;

    --ink: #24392B;
    --ink-dark: #182619;
    --gold: #B8862F;
    --gold-soft: rgba(184, 134, 47, 0.20);
    --gold-strong: rgba(184, 134, 47, 0.55);

    --bg: #EFEAE0;
    --text: #201D16;
    --text-muted: #6B6355;
    --divider: #DAD3C2;
    --surface: #F7F4EC;
    --danger: #9A3B2E;

    --space-xs: 6px;
    --space-sm: 10px;
    --space-md: 16px;
    --space-lg: 24px;
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14140F;
      --text: #EDE7D8;
      --text-muted: #A79C89;
      --divider: #2E2B23;
      --surface: #1B1B14;
      --gold: #D4A64B;
      --gold-soft: rgba(212, 166, 75, 0.22);
      --gold-strong: rgba(212, 166, 75, 0.5);
      --ink: #16241B;
      --ink-dark: #0F1811;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14140F;
    --text: #EDE7D8;
    --text-muted: #A79C89;
    --divider: #2E2B23;
    --surface: #1B1B14;
    --gold: #D4A64B;
    --gold-soft: rgba(212, 166, 75, 0.22);
    --gold-strong: rgba(212, 166, 75, 0.5);
    --ink: #16241B;
    --ink-dark: #0F1811;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- Header ---------- */
  .header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--ink);
    padding: calc(var(--space-md) + env(safe-area-inset-top, 0px)) var(--space-md) var(--space-md);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  .header-title {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 1.3rem;
    color: #F4EFE2;
    margin: 0 0 var(--space-sm) 0;
  }
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    opacity: 0.55;
  }
  .search-input {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 1rem;
    padding: 12px 40px 12px 38px;
    border-radius: var(--radius);
    border: none;
    background: #F4EFE2;
    color: #201D16;
    outline: none;
  }
  .search-input::placeholder { color: #837A66; }
  .search-input:focus-visible { box-shadow: 0 0 0 2px var(--gold); }
  .clear-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #6B6355;
    font-size: 1.1rem;
    line-height: 1;
    padding: 8px;
    cursor: pointer;
    display: none;
  }
  .search-wrap.has-value .clear-btn { display: block; }

  /* ---------- Layout ---------- */
  .view { display: none; }
  .view.active { display: block; }
  .body-pad { padding: var(--space-md); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

  .section-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin: 0 0 var(--space-sm) 0;
  }

  .empty-state {
    text-align: center;
    padding: 48px var(--space-md);
    color: var(--text-muted);
  }
  .empty-state .big { font-family: var(--font-serif); font-size: 1.15rem; color: var(--text); margin-bottom: 6px; }

  /* ---------- File list rows ---------- */
  .file-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-md);
    padding: 14px 4px;
    border-bottom: 1px solid var(--divider);
    cursor: pointer;
  }
  .file-row:last-child { border-bottom: none; }
  .file-row-main { min-width: 0; }
  .file-row-title {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 3px 0;
    overflow-wrap: break-word;
  }
  .file-row-meta { font-size: 0.82rem; color: var(--text-muted); }
  .file-row-badge {
    flex-shrink: 0;
    font-size: 0.78rem;
    color: var(--ink);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .file-row-badge { color: var(--gold); }
  }
  :root[data-theme="dark"] .file-row-badge { color: var(--gold); }

  /* ---------- Search results ---------- */
  .result-group { margin-bottom: var(--space-lg); }
  .result-group-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    cursor: pointer;
    margin-bottom: var(--space-xs);
  }
  .result-group-title { font-family: var(--font-serif); font-weight: 600; font-size: 1.02rem; }
  .result-group-count { font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; }
  .snippet {
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text-muted);
    padding: 8px 10px;
    background: var(--surface);
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .snippet mark, .file-content mark.match {
    background: var(--gold-soft);
    color: var(--text);
    border-radius: 3px;
    padding: 0 1px;
  }
  .file-content mark.match.active {
    background: var(--gold-strong);
  }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: var(--space-lg);
    bottom: calc(var(--space-lg) + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--ink);
    color: #F4EFE2;
    border: none;
    font-size: 1.8rem;
    line-height: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    cursor: pointer;
    z-index: 15;
  }

  /* ---------- File detail view ---------- */
  .file-view-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--ink);
    padding: calc(var(--space-sm) + env(safe-area-inset-top, 0px)) var(--space-md) var(--space-sm);
  }
  .fv-top-row { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-sm); }
  .icon-btn {
    background: transparent;
    border: none;
    color: #F4EFE2;
    font-size: 1.3rem;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .icon-btn:active { background: rgba(255,255,255,0.12); }
  .fv-title {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 1.08rem;
    color: #F4EFE2;
    margin: 0;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fv-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .match-nav {
    display: none;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: var(--space-xs);
  }
  .match-nav.active { display: flex; }
  .match-nav span { font-size: 0.82rem; color: #D8D2C0; margin: 0 6px; }
  .file-meta-line {
    padding: var(--space-md) var(--space-md) 0;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .file-content {
    padding: var(--space-md);
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: break-word;
    font-size: 0.98rem;
    line-height: 1.65;
  }

  /* ---------- Buttons ---------- */
  .btn-primary, .btn-secondary, .btn-danger {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 0.98rem;
    border-radius: var(--radius);
    padding: 12px 18px;
    border: none;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary { background: var(--ink); color: #F4EFE2; }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--divider); }
  .btn-danger { background: var(--danger); color: #fff; }

  /* ---------- Sheet (add file) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 15, 0.5);
    z-index: 30;
    display: none;
  }
  .overlay.active { display: block; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 31;
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    padding: var(--space-lg) var(--space-md) calc(var(--space-lg) + env(safe-area-inset-bottom, 0px));
    max-height: 88vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .overlay.active .sheet { transform: translateY(0); }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); }
  .sheet-header h2 { font-family: var(--font-serif); font-size: 1.2rem; margin: 0; }
  .field-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
  .text-input, textarea.text-input {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 1rem;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--divider);
    background: var(--surface);
    color: var(--text);
    margin-bottom: var(--space-md);
    outline: none;
  }
  .text-input:focus-visible { box-shadow: 0 0 0 2px var(--gold); }
  textarea.text-input { resize: vertical; min-height: 140px; font-family: var(--font-sans); }

  .tabs { display: flex; gap: 6px; margin-bottom: var(--space-md); }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 8px;
    border: 1px solid var(--divider);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 0.9rem;
    font-family: var(--font-sans);
    cursor: pointer;
  }
  .tab.active { background: var(--ink); color: #F4EFE2; border-color: var(--ink); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .file-drop {
    border: 1px dashed var(--divider);
    border-radius: 8px;
    padding: var(--space-md);
    text-align: center;
    margin-bottom: var(--space-sm);
  }
  .file-drop input[type=file] { width: 100%; font-size: 0.9rem; color: var(--text-muted); }
  .hint { font-size: 0.82rem; color: var(--text-muted); margin: 4px 0 var(--space-md); }
  .hint.hidden { display: none; }

  /* ---------- Confirm dialog ---------- */
  .confirm-box {
    position: fixed;
    left: var(--space-md); right: var(--space-md);
    top: 50%; transform: translateY(-50%);
    z-index: 41;
    background: var(--bg);
    border-radius: 14px;
    padding: var(--space-lg) var(--space-md);
    display: none;
  }
  .confirm-box.active { display: block; }
  .confirm-box p { font-family: var(--font-serif); font-size: 1.05rem; margin: 0 0 var(--space-lg) 0; }
  .confirm-actions { display: flex; gap: var(--space-sm); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: #F4EFE2;
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <!-- HOME VIEW -->
  <div id="homeView" class="view active">
    <div class="header">
      <p class="header-title">Wissensspeicher</p>
      <div class="search-wrap" id="searchWrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#201D16" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="globalSearchInput" class="search-input" type="search" placeholder="In deinem Wissen suchen…" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="clear-btn" id="clearGlobalSearch">✕</button>
      </div>
    </div>
    <div class="body-pad" id="homeBody"></div>
  </div>

  <!-- FILE VIEW -->
  <div id="fileView" class="view">
    <div class="file-view-header">
      <div class="fv-top-row">
        <button class="icon-btn" id="backBtn" aria-label="Zurück">‹</button>
        <p class="fv-title" id="fvTitle"></p>
        <div class="fv-actions">
          <button class="icon-btn" id="exportBtn" aria-label="Exportieren" title="Exportieren">⭳</button>
          <button class="icon-btn" id="deleteBtn" aria-label="Löschen" title="Löschen">🗑</button>
        </div>
      </div>
      <div class="search-wrap" id="withinSearchWrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#201D16" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="withinSearchInput" class="search-input" type="search" placeholder="In dieser Datei suchen…" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="clear-btn" id="clearWithinSearch">✕</button>
      </div>
      <div class="match-nav" id="matchNav">
        <button class="icon-btn" id="prevMatch" aria-label="Vorheriger Treffer">‹</button>
        <span id="matchCount"></span>
        <button class="icon-btn" id="nextMatch" aria-label="Nächster Treffer">›</button>
      </div>
    </div>
    <div class="file-meta-line" id="fvMeta"></div>
    <div class="file-content" id="fvContent"></div>
  </div>

  <button class="fab" id="addFab" aria-label="Datei hinzufügen">+</button>

  <!-- ADD FILE SHEET -->
  <div class="overlay" id="addOverlay">
    <div class="sheet" id="addSheet">
      <div class="sheet-header">
        <h2>Neue Wissensdatei</h2>
        <button class="icon-btn" id="closeSheet" style="color:var(--text)" aria-label="Schließen">✕</button>
      </div>
      <label class="field-label" for="fileTitleInput">Titel</label>
      <input id="fileTitleInput" class="text-input" type="text" maxlength="120" placeholder="z. B. Haftungsrecht Grundlagen">

      <div class="tabs">
        <button class="tab active" id="tabUploadBtn" data-tab="upload">Datei hochladen</button>
        <button class="tab" id="tabPasteBtn" data-tab="paste">Text einfügen</button>
      </div>

      <div class="tab-panel active" id="panelUpload">
        <div class="file-drop">
          <input type="file" id="fileInput" accept=".txt,text/plain">
        </div>
        <p class="hint" id="fileInfo"></p>
      </div>

      <div class="tab-panel" id="panelPaste">
        <textarea id="pasteInput" class="text-input" placeholder="Text hier einfügen…"></textarea>
      </div>

      <button class="btn-primary" id="saveFileBtn" disabled>Speichern</button>
      <p class="hint hidden" id="saveProgress"></p>
    </div>
  </div>

  <!-- CONFIRM DIALOG -->
  <div class="overlay" id="confirmOverlay"></div>
  <div class="confirm-box" id="confirmBox">
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button class="btn-secondary" id="confirmCancel">Abbrechen</button>
      <button class="btn-danger" id="confirmOk">Löschen</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= IndexedDB storage ================= */
  const DB_NAME = 'wissensspeicher_db';
  const DB_VERSION = 1;
  const STORE = 'files';
  let idbPromise = null;

  function openDatabase(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)){
          db.createObjectStore(STORE, {keyPath: 'id'});
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function getIdb(){ if(!idbPromise) idbPromise = openDatabase(); return idbPromise; }

  async function idbGetAll(){
    const db = await getIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbPut(record){
    const db = await getIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbDelete(id){
    const db = await getIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  /* ================= State ================= */
  let files = [];
  let currentFileId = null;
  let withinQuery = '';
  let currentMatches = [];
  let currentMatchIdx = 0;
  let downloadsCap = null;
  let pendingUploadText = '';
  let activeTab = 'upload';

  /* ================= DOM refs ================= */
  const homeView = document.getElementById('homeView');
  const fileView = document.getElementById('fileView');
  const homeBody = document.getElementById('homeBody');
  const globalSearchInput = document.getElementById('globalSearchInput');
  const searchWrap = document.getElementById('searchWrap');
  const clearGlobalSearch = document.getElementById('clearGlobalSearch');

  const fvTitle = document.getElementById('fvTitle');
  const fvMeta = document.getElementById('fvMeta');
  const fvContent = document.getElementById('fvContent');
  const withinSearchInput = document.getElementById('withinSearchInput');
  const withinSearchWrap = document.getElementById('withinSearchWrap');
  const clearWithinSearch = document.getElementById('clearWithinSearch');
  const matchNav = document.getElementById('matchNav');
  const matchCount = document.getElementById('matchCount');

  const addOverlay = document.getElementById('addOverlay');
  const fileTitleInput = document.getElementById('fileTitleInput');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const pasteInput = document.getElementById('pasteInput');
  const saveFileBtn = document.getElementById('saveFileBtn');
  const saveProgress = document.getElementById('saveProgress');

  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmBox = document.getElementById('confirmBox');
  const confirmText = document.getElementById('confirmText');
  const toastEl = document.getElementById('toast');

  /* ================= Helpers ================= */
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function wordCount(text){
    const m = text.trim().match(/\S+/g);
    return m ? m.length : 0;
  }
  function formatDate(ts){
    return new Date(ts).toLocaleDateString('de-DE', {day:'2-digit', month:'long', year:'numeric'});
  }
  function findMatchIndices(text, query){
    if(!query) return [];
    const lc = text.toLowerCase();
    const q = query.toLowerCase();
    if(!q) return [];
    const res = [];
    let i = 0;
    while(true){
      const idx = lc.indexOf(q, i);
      if(idx === -1) break;
      res.push(idx);
      i = idx + q.length;
    }
    return res;
  }
  function buildSnippet(text, matchIndex, queryLen, context){
    context = context || 90;
    let start = Math.max(0, matchIndex - context);
    let end = Math.min(text.length, matchIndex + queryLen + context);
    while (start > 0 && !/\s/.test(text[start])) start--;
    while (end < text.length && !/\s/.test(text[end])) end++;
    const prefix = start > 0 ? '…' : '';
    const suffix = end < text.length ? '…' : '';
    return {
      before: text.slice(start, matchIndex),
      match: text.slice(matchIndex, matchIndex + queryLen),
      after: text.slice(matchIndex + queryLen, end),
      prefix, suffix
    };
  }
  function snippetHtml(text, matchIndex, queryLen){
    const s = buildSnippet(text, matchIndex, queryLen);
    return s.prefix + escapeHtml(s.before) + '<mark>' + escapeHtml(s.match) + '</mark>' + escapeHtml(s.after) + s.suffix;
  }
  function highlightedContentHtml(text, query){
    if(!query) return escapeHtml(text);
    const matches = findMatchIndices(text, query);
    if(!matches.length) return escapeHtml(text);
    const parts = [];
    let last = 0;
    matches.forEach((m, i) => {
      parts.push(escapeHtml(text.slice(last, m)));
      parts.push('<mark class="match" id="match-' + i + '">' + escapeHtml(text.slice(m, m + query.length)) + '</mark>');
      last = m + query.length;
    });
    parts.push(escapeHtml(text.slice(last)));
    return parts.join('');
  }
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }
  function debounce(fn, ms){
    let t;
    return function(){
      clearTimeout(t);
      const args = arguments;
      t = setTimeout(() => fn.apply(null, args), ms);
    };
  }

  /* ================= Init ================= */
  async function init(){
    try {
      const records = await idbGetAll();
      records.sort((a,b) => b.createdAt - a.createdAt);
      files = records;
    } catch(e){
      console.error(e);
      showToast('Deine Dateien konnten nicht geladen werden.');
    }
    renderHome();
    history.replaceState({view: 'home'}, '', '');

    try {
      if (window.claude && typeof window.claude.use === 'function'){
        downloadsCap = await window.claude.use('downloads');
      }
    } catch(e){ downloadsCap = null; }
  }

  window.addEventListener('popstate', (e) => {
    const s = e.state || {view: 'home'};
    if (s.view === 'file' && s.id){
      showFileView(s.id, {resetQuery: false, push: false});
    } else {
      showHomeView({push: false});
    }
  });

  /* ================= Home view ================= */
  function showHomeView(opts){
    opts = opts || {};
    fileView.classList.remove('active');
    homeView.classList.add('active');
    if (opts.push !== false) history.pushState({view: 'home'}, '', '');
    renderHome();
  }

  function renderHome(){
    const query = globalSearchInput.value.trim();
    searchWrap.classList.toggle('has-value', !!query);

    if (!query){
      renderLibraryList();
      return;
    }

    const results = [];
    files.forEach(f => {
      const matches = findMatchIndices(f.content, query);
      if (matches.length) results.push({file: f, matches});
    });
    results.sort((a,b) => b.matches.length - a.matches.length);

    if (!results.length){
      homeBody.innerHTML = '<div class="empty-state"><p class="big">Keine Treffer</p><p>Für „' + escapeHtml(query) + '“ wurde nichts in deinen Dateien gefunden.</p></div>';
      return;
    }

    let html = '';
    results.forEach(r => {
      const f = r.file;
      const shown = r.matches.slice(0, 2);
      html += '<div class="result-group">';
      html += '<div class="result-group-header" data-open="' + f.id + '" data-qlen="' + query.length + '" data-jump="' + shown[0] + '" data-idx="0">';
      html += '<span class="result-group-title">' + escapeHtml(f.title) + '</span>';
      html += '<span class="result-group-count">' + r.matches.length + (r.matches.length === 1 ? ' Treffer' : ' Treffer') + '</span>';
      html += '</div>';
      shown.forEach((m, i) => {
        html += '<div class="snippet" data-open="' + f.id + '" data-jump="' + i + '">' + snippetHtml(f.content, m, query.length) + '</div>';
      });
      if (r.matches.length > shown.length){
        html += '<div class="snippet" data-open="' + f.id + '" data-jump="0" style="color:var(--gold);background:transparent;padding-left:10px;">+' + (r.matches.length - shown.length) + ' weitere Fundstelle' + (r.matches.length - shown.length === 1 ? '' : 'n') + '</div>';
      }
      html += '</div>';
    });
    homeBody.innerHTML = html;

    homeBody.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', () => {
        const fid = el.getAttribute('data-open');
        const jump = parseInt(el.getAttribute('data-jump'), 10) || 0;
        showFileView(fid, {query: query, jumpToIndex: jump});
      });
    });
  }

  function renderLibraryList(){
    if (!files.length){
      homeBody.innerHTML = '<div class="empty-state"><p class="big">Noch nichts gespeichert</p><p>Tippe unten auf „+“, um deine erste Wissensdatei hinzuzufügen.</p></div>';
      return;
    }
    const totalWords = files.reduce((s,f) => s + (f.wordCount||0), 0);
    let html = '<p class="section-label">' + files.length + (files.length===1 ? ' Datei' : ' Dateien') + ' mit insgesamt ' + totalWords.toLocaleString('de-DE') + ' Wörtern.</p>';
    files.forEach(f => {
      html += '<div class="file-row" data-open="' + f.id + '">';
      html += '<div class="file-row-main">';
      html += '<p class="file-row-title">' + escapeHtml(f.title) + '</p>';
      html += '<p class="file-row-meta">' + formatDate(f.createdAt) + ' · ' + (f.wordCount||0).toLocaleString('de-DE') + ' Wörter</p>';
      html += '</div></div>';
    });
    homeBody.innerHTML = html;
    homeBody.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', () => showFileView(el.getAttribute('data-open')));
    });
  }

  globalSearchInput.addEventListener('input', debounce(renderHome, 120));
  clearGlobalSearch.addEventListener('click', () => {
    globalSearchInput.value = '';
    globalSearchInput.focus();
    renderHome();
  });
  globalSearchInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') e.target.blur(); });

  /* ================= File view ================= */
  function showFileView(fileId, opts){
    opts = opts || {};
    const file = files.find(f => f.id === fileId);
    if (!file){ showHomeView(); return; }

    currentFileId = fileId;
    withinQuery = opts.query || '';
    currentMatchIdx = opts.jumpToIndex || 0;

    homeView.classList.remove('active');
    fileView.classList.add('active');
    if (opts.push !== false) history.pushState({view: 'file', id: fileId}, '', '');

    renderFileView({scrollToMatch: !!withinQuery});
  }

  function renderFileView(opts){
    opts = opts || {};
    const file = files.find(f => f.id === currentFileId);
    if (!file) { showHomeView(); return; }

    fvTitle.textContent = file.title;
    fvMeta.textContent = formatDate(file.createdAt) + ' · ' + (file.wordCount||0).toLocaleString('de-DE') + ' Wörter · ' + (file.charCount||0).toLocaleString('de-DE') + ' Zeichen';
    withinSearchInput.value = withinQuery;
    withinSearchWrap.classList.toggle('has-value', !!withinQuery);

    fvContent.innerHTML = highlightedContentHtml(file.content, withinQuery);
    currentMatches = withinQuery ? findMatchIndices(file.content, withinQuery) : [];

    if (currentMatches.length){
      matchNav.classList.add('active');
      if (currentMatchIdx >= currentMatches.length) currentMatchIdx = 0;
      updateMatchCount();
      setActiveMatch(currentMatchIdx, {scroll: opts.scrollToMatch});
    } else {
      matchNav.classList.remove('active');
    }
  }

  function updateMatchCount(){
    matchCount.textContent = (currentMatchIdx + 1) + ' von ' + currentMatches.length;
  }
  function setActiveMatch(idx, opts){
    opts = opts || {};
    fvContent.querySelectorAll('mark.match.active').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('match-' + idx);
    if (el){
      el.classList.add('active');
      if (opts.scroll !== false){
        el.scrollIntoView({block: 'center', behavior: 'smooth'});
      }
    }
  }

  document.getElementById('backBtn').addEventListener('click', () => history.back());
  document.getElementById('prevMatch').addEventListener('click', () => {
    if (!currentMatches.length) return;
    currentMatchIdx = (currentMatchIdx - 1 + currentMatches.length) % currentMatches.length;
    updateMatchCount();
    setActiveMatch(currentMatchIdx);
  });
  document.getElementById('nextMatch').addEventListener('click', () => {
    if (!currentMatches.length) return;
    currentMatchIdx = (currentMatchIdx + 1) % currentMatches.length;
    updateMatchCount();
    setActiveMatch(currentMatchIdx);
  });

  withinSearchInput.addEventListener('input', debounce(() => {
    withinQuery = withinSearchInput.value.trim();
    currentMatchIdx = 0;
    renderFileView({scrollToMatch: false});
  }, 150));
  clearWithinSearch.addEventListener('click', () => {
    withinSearchInput.value = '';
    withinQuery = '';
    currentMatchIdx = 0;
    renderFileView({scrollToMatch: false});
    withinSearchInput.focus();
  });
  withinSearchInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') e.target.blur(); });

  /* ---- Export ---- */
  document.getElementById('exportBtn').addEventListener('click', async () => {
    const file = files.find(f => f.id === currentFileId);
    if (!file) return;
    if (!downloadsCap){
      showToast('Export ist in dieser Ansicht nicht verfügbar.');
      return;
    }
    try {
      const safeName = file.title.replace(/[\/\\:*?"<>|]/g, '').trim() || 'wissensdatei';
      await downloadsCap.save({filename: safeName + '.txt', data: file.content});
      showToast('Datei exportiert.');
    } catch(e){
      if (e && e.code === 'declined') return;
      showToast('Export fehlgeschlagen.');
    }
  });

  /* ---- Delete ---- */
  let pendingDeleteId = null;
  document.getElementById('deleteBtn').addEventListener('click', () => {
    const file = files.find(f => f.id === currentFileId);
    if (!file) return;
    pendingDeleteId = file.id;
    confirmText.textContent = '„' + file.title + '“ endgültig löschen?';
    confirmOverlay.classList.add('active');
    confirmBox.classList.add('active');
  });
  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
  confirmOverlay.addEventListener('click', closeConfirm);
  function closeConfirm(){
    confirmOverlay.classList.remove('active');
    confirmBox.classList.remove('active');
    pendingDeleteId = null;
  }
  document.getElementById('confirmOk').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const id = pendingDeleteId;
    closeConfirm();
    try {
      await idbDelete(id);
      files = files.filter(f => f.id !== id);
      showToast('Datei gelöscht.');
      history.back();
    } catch(e){
      showToast('Löschen fehlgeschlagen.');
    }
  });

  /* ================= Add file sheet ================= */
  const addFab = document.getElementById('addFab');
  const closeSheetBtn = document.getElementById('closeSheet');

  addFab.addEventListener('click', openAddSheet);
  closeSheetBtn.addEventListener('click', closeAddSheet);
  addOverlay.addEventListener('click', (e) => { if (e.target === addOverlay) closeAddSheet(); });

  function openAddSheet(){
    fileTitleInput.value = '';
    pasteInput.value = '';
    fileInput.value = '';
    fileInfo.textContent = '';
    pendingUploadText = '';
    activeTab = 'upload';
    setActiveTab('upload');
    saveProgress.classList.add('hidden');
    updateSaveEnabled();
    addOverlay.classList.add('active');
  }
  function closeAddSheet(){
    addOverlay.classList.remove('active');
  }

  function setActiveTab(tab){
    activeTab = tab;
    document.getElementById('tabUploadBtn').classList.toggle('active', tab === 'upload');
    document.getElementById('tabPasteBtn').classList.toggle('active', tab === 'paste');
    document.getElementById('panelUpload').classList.toggle('active', tab === 'upload');
    document.getElementById('panelPaste').classList.toggle('active', tab === 'paste');
    updateSaveEnabled();
  }
  document.getElementById('tabUploadBtn').addEventListener('click', () => setActiveTab('upload'));
  document.getElementById('tabPasteBtn').addEventListener('click', () => setActiveTab('paste'));

  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f){ pendingUploadText = ''; fileInfo.textContent = ''; updateSaveEnabled(); return; }
    const reader = new FileReader();
    reader.onload = () => {
      pendingUploadText = String(reader.result || '');
      fileInfo.textContent = f.name + ' · ' + Math.round(f.size/1024).toLocaleString('de-DE') + ' KB gelesen';
      if (!fileTitleInput.value.trim()){
        fileTitleInput.value = f.name.replace(/\.[^.]+$/, '');
      }
      updateSaveEnabled();
    };
    reader.onerror = () => {
      showToast('Datei konnte nicht gelesen werden.');
    };
    reader.readAsText(f, 'UTF-8');
  });

  function currentText(){
    return activeTab === 'upload' ? pendingUploadText : pasteInput.value;
  }
  function updateSaveEnabled(){
    const hasTitle = fileTitleInput.value.trim().length > 0;
    const hasText = currentText().trim().length > 0;
    saveFileBtn.disabled = !(hasTitle && hasText);
  }
  fileTitleInput.addEventListener('input', updateSaveEnabled);
  pasteInput.addEventListener('input', updateSaveEnabled);

  saveFileBtn.addEventListener('click', async () => {
    const title = fileTitleInput.value.trim();
    const text = currentText();
    if (!title || !text.trim()) return;

    saveFileBtn.disabled = true;
    saveProgress.classList.remove('hidden');
    saveProgress.textContent = 'Wird gespeichert …';

    const record = {
      id: 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8),
      title: title,
      content: text,
      createdAt: Date.now(),
      charCount: text.length,
      wordCount: wordCount(text)
    };

    try {
      await idbPut(record);
      files.unshift(record);
      closeAddSheet();
      showToast('„' + title + '“ gespeichert.');
      renderHome();
    } catch(e){
      console.error(e);
      saveProgress.textContent = 'Fehler beim Speichern. Bitte erneut versuchen.';
      saveFileBtn.disabled = false;
    }
  });

  init();
})();
</script>
</body>
</html>
